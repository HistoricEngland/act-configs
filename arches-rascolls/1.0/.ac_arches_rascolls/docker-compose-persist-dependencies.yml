
services:
    nginx-arches-rascolls-1e5cb:
      container_name: nginx-arches-rascolls-1e5cb
      image: nginx:latest
      ports:
        - "8080:80"
      volumes:
        - ./docker/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - arches-rascolls-1e5cb-network

    db-arches-rascolls-1e5cb:
      container_name: db-arches-rascolls-1e5cb
      image: postgis/postgis:16-3.5
      volumes:
        - ../../arches_rascolls-postgres-data:/var/lib/postgresql/data
        - ../../arches_rascolls-postgres-log:/var/log/postgresql
        - ./docker/init-unix.sql:/docker-entrypoint-initdb.d/init.sql # to set up the DB template
      ports:
        - '5433:5432'
      env_file: 
        - ./docker/env_file.env
      networks:
        - arches-rascolls-1e5cb-network

    elastic-bindmount-init-arches-rascolls-1e5cb:
      image: alpine
      container_name: elastic-bindmount-init-arches-rascolls-1e5cb
      restart: "no"
      entrypoint: |
        /bin/sh -c "chown 1000:1000 /esBindMount"
      volumes:
        - ../../arches_rascolls-elasticsearch-data:/esBindMount


    elasticsearch-arches-rascolls-1e5cb:
      container_name: elasticsearch-arches-rascolls-1e5cb
      image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
      #platform: linux/arm64
      volumes:
        - ../../arches_rascolls-elasticsearch-data:/usr/share/elasticsearch/data
      ports:
        - "9201:9200"
        - "9301:9300"
      env_file: 
        - ./docker/env_file.env
      networks:
        - arches-rascolls-1e5cb-network
      depends_on:
        - elastic-bindmount-init-arches-rascolls-1e5cb

    rabbitmq-arches-rascolls-1e5cb:
      container_name: rabbitmq-arches-rascolls-1e5cb
      image: rabbitmq:4.1-management
      hostname: my-rabbit
      volumes:
        - rabbitmq-data-1e5cb:/var/lib/rabbitmq/mnesia/rabbit@my-rabbit
        - rabbitmq-logs-1e5cb:/var/log/rabbitmq/log
      ports:
        - 5673:5672
        - 15673:15672
      networks:
        - arches-rascolls-1e5cb-network

