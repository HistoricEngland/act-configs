networks:
  arches-lingo-ed22d-network:
    name: arches-lingo-ed22d-network
    driver: bridge

volumes:
    postgres-data-ed22d:
    postgres-log-ed22d:
    elasticsearch-data-ed22d:
    rabbitmq-logs-ed22d:
    rabbitmq-data-ed22d:
