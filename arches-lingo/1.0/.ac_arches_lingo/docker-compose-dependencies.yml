
services:
    nginx-arches-lingo-ed22d:
      container_name: nginx-arches-lingo-ed22d
      image: nginx:latest
      ports:
        - "8080:80"
      volumes:
        - ./docker/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - arches-lingo-ed22d-network

    db-arches-lingo-ed22d:
      container_name: db-arches-lingo-ed22d
      image: postgis/postgis:16-3.5
      volumes:
        - postgres-data-ed22d:/var/lib/postgresql/data
        - postgres-log-ed22d:/var/log/postgresql
        - ./docker/init-unix.sql:/docker-entrypoint-initdb.d/init.sql # to set up the DB template
      ports:
        - '5433:5432'
      env_file: 
        - ./docker/env_file.env
      networks:
        - arches-lingo-ed22d-network

    elasticsearch-arches-lingo-ed22d:
      container_name: elasticsearch-arches-lingo-ed22d
      image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
      #platform: linux/arm64
      volumes:
        - elasticsearch-data-ed22d:/usr/share/elasticsearch/data
      ports:
        - "9201:9200"
        - "9301:9300"
      env_file: 
        - ./docker/env_file.env
      networks:
        - arches-lingo-ed22d-network

    rabbitmq-arches-lingo-ed22d:
      container_name: rabbitmq-arches-lingo-ed22d
      image: rabbitmq:4.1-management
      hostname: my-rabbit
      volumes:
        - rabbitmq-data-ed22d:/var/lib/rabbitmq/mnesia/rabbit@my-rabbit
        - rabbitmq-logs-ed22d:/var/log/rabbitmq/log
      ports:
        - 5673:5672
        - 15673:15672
      networks:
        - arches-lingo-ed22d-network

