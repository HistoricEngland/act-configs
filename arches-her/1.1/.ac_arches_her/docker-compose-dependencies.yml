networks:
  arches-her-c0d8d-network:
    name: arches-her-c0d8d-network
    driver: bridge

volumes:
    postgres-data-c0d8d:
    postgres-log-c0d8d:
    elasticsearch-data-c0d8d:
    rabbitmq-logs-c0d8d:
    rabbitmq-data-c0d8d:
